# Copy to argus.yaml and edit. Secrets are NOT in this file: the database
# connection string and the object storage keys are read from environment
# variables, so that this file can be committed safely.
#
#   ARGUS_DATABASE_URL           postgres://user:password@host:5432/dbname
#   ARGUS_S3_ACCESS_KEY_ID       only needed with storage.s3
#   ARGUS_S3_SECRET_ACCESS_KEY   only needed with storage.s3
#   ARGUS_AGE_IDENTITY           the private key, only needed by restore

# Exactly one storage backend.
storage:
  local:
    path: ./argus-data

  # s3:
  #   endpoint: s3.eu-central-1.amazonaws.com
  #   bucket: argus-backups
  #   region: eu-central-1
  #
  #   Any S3-compatible store works: Backblaze B2, Cloudflare R2, Scaleway,
  #   or a local MinIO. Only a local MinIO should ever need `insecure: true`,
  #   which turns TLS off; leaving it out keeps TLS on.

# Optional. When present, artifacts are encrypted to this age recipient.
#
# A recipient is a public key, so it is safe in this file. Keep the matching
# identity somewhere else entirely: that is the point of encrypting this way,
# since a server that is compromised can then write new backups but cannot
# read back the ones it already made.
#
# Generate a pair with:
#   age-keygen -o argus-identity.txt
#
# encryption:
#   recipient: age1...
#
# The identity from that file is what restore needs, passed as
# ARGUS_AGE_IDENTITY. backup never sees it.

# Optional. Tunes what counts as a successful verification.
#
# verification:
#   # How far a restored table's row count may differ from the count the
#   # backup recorded, as a fraction. Defaults to 0.01.
#   #
#   # Not zero by default: counts are read just before pg_dump starts, and
#   # pg_dump then runs in its own consistent snapshot, so on a database
#   # being written to the two legitimately disagree.
#   row_count_tolerance: 0.01
#
#   # An optional query run against the restored database. It must succeed
#   # and return at least one row. argus can check that the shape and size
#   # of the data came back; only you can say whether it means anything.
#   smoke_query: "SELECT 1 FROM users WHERE email IS NOT NULL LIMIT 1"

# Optional. How many backups prune keeps. Anything left out keeps its
# default, so setting only `daily` does not switch the other rules off.
#
# Periods are counted from the backups that exist, not from today: a system
# that stopped backing up does not lose its history all at once.
#
# retention:
#   daily: 7
#   weekly: 4
#   monthly: 6
